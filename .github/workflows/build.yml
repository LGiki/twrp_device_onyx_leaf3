name: Build TWRP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twrp-leaf3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: TWRP 11 recovery image
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ALLOW_MISSING_DEPENDENCIES: "true"
      LC_ALL: C
      LANG: C
      BUILD_JOBS: "4"
      USE_CCACHE: "1"
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: device/onyx/leaf3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ccache cpio curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libssl-dev libxml2-utils lzop \
            openjdk-11-jdk python3 python3-venv repo rsync schedtool \
            squashfs-tools unzip xz-utils xsltproc zip zlib1g-dev

      - name: Show runner storage
        run: df -h

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ runner.os }}-ccache-twrp11-leaf3-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-twrp11-leaf3-

      - name: Configure compiler cache
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --max-size=4G
          ccache --zero-stats

      - name: Initialize TWRP 11 source
        run: |
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-11
          repo sync -c --no-clone-bundle --no-tags --fail-fast -j4

      - name: Restore verified Page OTA
        uses: actions/cache@v4
        with:
          path: device/onyx/leaf3/.cache/page-3.5-stock/update.upx
          key: page-3.5-ota-0be5912e1bc73a8177abe03623f0d1140c01184c49a2f7d7012b43573f6e148c

      - name: Prepare stock build inputs
        run: device/onyx/leaf3/prepare-stock.sh

      - name: Apply Leaf3 TWRP patches
        run: device/onyx/leaf3/apply-patches.sh

      - name: Build recovery image
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          source build/envsetup.sh
          lunch twrp_leaf3-eng
          mka -j"${BUILD_JOBS}" recoveryimage

      - name: Show compiler cache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ccache --show-stats

      - name: Verify recovery image
        run: |
          set -euo pipefail
          IMAGE=out/target/product/leaf3/recovery.img
          UNPACKED="${RUNNER_TEMP}/leaf3-recovery"
          RAMDISK_CPIO="${RUNNER_TEMP}/leaf3-ramdisk.cpio"
          MAGISKBOOT=external/magisk-prebuilt/prebuilt/magiskboot_x86

          test -s "${IMAGE}"
          test "$(stat -c %s "${IMAGE}")" -le 100663296
          mkdir -p "${UNPACKED}"
          python3 system/tools/mkbootimg/unpack_bootimg.py \
            --boot_img "${IMAGE}" --out "${UNPACKED}" >/dev/null

          echo "d9390eb8a840b1b65929ba154f6efa42e8a42459e6296ca1143b6591c0728ec6  ${UNPACKED}/kernel" | sha256sum -c -
          echo "1b8480fcaffa603b252c53a96114384220681b877c81ca2b3c49728a51d50f68  ${UNPACKED}/dtb" | sha256sum -c -
          echo "274f175910629372e08b6c227db5e037a0e69fa0bbc3ddb85a9e4d428c085656  ${UNPACKED}/recovery_dtbo" | sha256sum -c -
          RAMDISK_SIZE=$(stat -c %s "${UNPACKED}/ramdisk")
          echo "Compressed ramdisk: ${RAMDISK_SIZE} bytes"
          test "${RAMDISK_SIZE}" -lt 15728640

          "${MAGISKBOOT}" decompress "${UNPACKED}/ramdisk" "${RAMDISK_CPIO}"
          "${MAGISKBOOT}" cpio "${RAMDISK_CPIO}" \
            "exists system/lib64/libion.so" \
            "exists init.recovery.qcom.rc" \
            "exists waveform/eink_waveform.wbf" \
            "exists twres/splash.xml" \
            "exists twres/ui.xml" \
            "exists twres/languages/en.xml"

          (cd "$(dirname "${IMAGE}")" && sha256sum recovery.img > recovery.img.sha256)

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-leaf3-${{ github.run_number }}
          path: |
            out/target/product/leaf3/recovery.img
            out/target/product/leaf3/recovery.img.sha256
          if-no-files-found: error
          retention-days: 14
